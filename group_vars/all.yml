---
# --- AWS / EC2 ---
# 
aws_region: us-east-1
instance_type: t3.small          
key_name: devops-13-lesson
key_file: "{{ playbook_dir }}/{{ key_name }}.pem"
sg_name: devops-13-lesson-sg
project_tag: devops-13-lesson   # tag:Project в aws_ec2.yml
state: present                   # present | absent
nodes:
  - { name: build-node, group: build }
  - { name: prod-node,  group: prod }

# --- SSH-connect ---
ansible_user: user
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_private_key_file: "{{ key_file }}"

# --- build ---
build_dir: /opt/build
repo_url: "https://github.com/spring-guides/gs-spring-boot.git"
repo_branch: main
project_subdir: complete
local_artifact: "{{ playbook_dir }}/artifacts/app.jar"

# --- prod ---
app_dir: /opt/java-app
app_user: javaapp
app_group: javaapp
app_port: 8080
